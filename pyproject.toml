[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "MSI-PICASSO"
version = "0.1.0"
description = "Symmetric target-decoy rescoring for MALDI-MSI MS1 data"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyteomics>=4.7",
    "psm_utils>=1.1",
    "ms2pip>=4.0.0a1",
    "deeplc>=4.0.0a1",
    "scikit-learn>=1.3",
    "brain-isotopic-distribution>=1.5",
    "cascade_config>=0.4",
]

[project.optional-dependencies]
maldi = ["imzy", "pyimzml", "ms-deisotope>=0.0.60"]
timstof = ["alphatims>=1.0"]
calibration = ["statsmodels>=0.14"]
mobility = ["im2deep>=0.1"]
explain = ["shap>=0.44"]

[project.scripts]
picasso = "msi_picasso.cli:main"
msi-picasso = "msi_picasso.cli:main"

[tool.pytest.ini_options]
testpaths = ["msi_picasso/tests"]

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
msi_picasso = ["package_data/*.json"]
