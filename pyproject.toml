[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ms1rescore"
version = "0.1.0"
description = "Symmetric target-decoy rescoring for MALDI-MSI MS1 data"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyteomics>=4.7",
    "psm_utils>=1.1",
    "mokapot>=0.10",
    "ms2pip>=4.0.0a1",
    "deeplc>=4.0.0a1",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
maldi = ["imzy"]
catboost = ["catboost>=1.2"]
calibration = ["statsmodels>=0.14"]
mobility = ["im2deep>=0.1"]

[tool.setuptools.packages.find]
where = ["."]
